name: zishu_ai
description: Zishu AI Voice Assistant - Your personal AI assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Voice & Speech
  speech_to_text: ^6.6.0
  flutter_tts: ^3.8.0
  
  # Networking
  http: ^1.1.0
  dio: ^5.3.2
  
  # State Management
  provider: ^6.0.5
  get_it: ^7.6.0
  
  # Local Storage
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # UI & Animations
  flutter_animate: ^4.1.1
  lottie: ^2.7.0
  
  # Background & Permissions
  flutter_background: ^1.2.0
  permission_handler: ^11.0.1
  android_alarm_manager_plus: ^4.0.3
  flutter_local_notifications: ^17.0.0
  
  # Utilities
  connectivity_plus: ^5.0.1
  device_info_plus: ^9.1.0
  intl: ^0.18.1
  url_launcher: ^6.1.14
  vibration: ^1.8.0
  
  # Wake Word
  wake_word: ^0.1.0
  
  # Firebase (optional)
  firebase_core: ^2.24.0
  firebase_analytics: ^10.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.6
  hive_generator: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/sounds/
    - assets/animations/
